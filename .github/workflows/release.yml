name: Release — Auto Tag & GitHub Release

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  release:
    name: Create Tag, Bump Versions & GitHub Release
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"

    steps:
      - name: Checkout repository with full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies, test & build before release
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Determine next version tag
        id: version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          CANDIDATE_TAG="v${PKG_VERSION#v}"

          # If the version in package.json hasn't been tagged yet (e.g. v1.0.0), use it directly
          if ! git rev-parse "$CANDIDATE_TAG" >/dev/null 2>&1; then
            NEXT_TAG="$CANDIDATE_TAG"
          else
            # Otherwise, bump the latest semver tag automatically based on commit message
            LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)
            if [ -z "$LATEST_TAG" ]; then
              LATEST_TAG="v1.0.0"
            fi

            CLEAN_VER="${LATEST_TAG#v}"
            CLEAN_VER="${CLEAN_VER%%-*}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VER"

            COMMIT_MSG=$(git log -1 --pretty=%B)
            if echo "$COMMIT_MSG" | grep -qiE "(BREAKING CHANGE|!:|^major)"; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
            elif echo "$COMMIT_MSG" | grep -qiE "(^feat|feat\(|feat:|merge.*feat)"; then
              MINOR=$((MINOR + 1))
              PATCH=0
            elif echo "$COMMIT_MSG" | grep -qiE "(^fix|fix\(|fix:|merge.*fix)"; then
              PATCH=$((PATCH + 1))
            else
              PATCH=$((PATCH + 1))
            fi

            NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          PLAIN_VER="${NEXT_TAG#v}"
          echo "Using release tag: $NEXT_TAG (version: $PLAIN_VER)"
          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$PLAIN_VER" >> "$GITHUB_OUTPUT"

      - name: Update package.json versions (root, api, web) & push release commit
        env:
          PLAIN_VER: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Update version in package.json (root, apps/api, apps/web) and package-lock.json
          npm version "$PLAIN_VER" --allow-same-version --no-git-tag-version --workspaces --include-workspace-root

          # Commit and push changes if package.json files changed
          if [ -n "$(git status --porcelain package.json apps/*/package.json package-lock.json)" ]; then
            git add package.json apps/api/package.json apps/web/package.json package-lock.json
            git commit -m "chore(release): bump version to $PLAIN_VER [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Create Git Tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Tag the release commit and push tag
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

          # Create the GitHub Release with notes
          gh release create "$TAG" \
            --title "Release $TAG" \
            --generate-notes \
            --verify-tag
