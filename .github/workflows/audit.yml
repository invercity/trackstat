name: Dependency Audit

on:
  push:
    branches: [master, main, 'feat/**']
  pull_request:
    branches: [master, main]
  schedule:
    # Run live npm security advisory check every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  security-audit:
    name: npm Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Run live npm security audit against npm Advisory DB
        run: |
          echo "### 🔒 Dependency Security Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "Checked at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm audit --omit=dev --audit-level=high | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
